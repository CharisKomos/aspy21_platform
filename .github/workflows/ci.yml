name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: ruff check
        run: python -m ruff check . --output-format=github

      - name: ruff format --check
        run: python -m ruff format --check .

  test:
    name: Self-test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject sets requires-python = ">=3.10"; test the whole range.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Show installed versions
        run: |
          python -c "import aspy21, pandas, httpx, fastapi; print('aspy21', aspy21.__version__); print('pandas', pandas.__version__); print('httpx', httpx.__version__); print('fastapi', fastapi.__version__)"

      - name: Run self-test
        # Drives every dashboard card through the ASGI app in-process.
        # No server is started and no network call leaves the runner.
        run: python selftest.py
